name: uneworld

# Versão de produção: usa as imagens já publicadas no GitHub Container Registry
# em vez de buildar a partir do código-fonte. Copie este arquivo (e o .env,
# baseado em .env.example) para o servidor e rode:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uneworld}
      POSTGRES_USER: ${DB_USER:-uneworld}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uneworld}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/djfrednunnenkamp/uneworld-sistema-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - media_data:/app/media
      - geoip_data:/app/geoip_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  frontend:
    image: ghcr.io/djfrednunnenkamp/uneworld-sistema-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host 80 → container 8080 (nginx roda não-root, escuta 8080). A-15
      - "${HTTP_PORT:-80}:8080"

volumes:
  db_data:
  media_data:
  geoip_data:
