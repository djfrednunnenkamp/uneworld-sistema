name: uneworld-intranet-api

# Compose da API (backend Django/Daphne) da intranet UneWorld.
# O Postgres NÃO roda aqui: conecta-se a um banco EXTERNO (ver DB_HOST/DB_PORT no .env).
# Só sobem o backend e o Redis (channels + cache/rate-limit).
#
# Subir:   docker compose up -d --build
# Logs:    docker compose logs -f backend
# Parar:   docker compose down

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Banco: usa o Postgres EXTERNO. DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD vêm do .env.
      DB_ENGINE: postgresql
      # Redis é o container acima (rede interna do compose).
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - media_data:/app/media
      - geoip_data:/app/geoip_db
    depends_on:
      redis:
        condition: service_healthy
    # Publica a porta do Daphne no host. O Nginx Proxy Manager (roteador público
    # do servidor) aponta backend-intranet.uneworld.com.br para esta
    # porta. 5800 escolhida por estar livre no servidor (8000 já é do flowbot-bot).
    ports:
      - "${BACKEND_PORT:-5800}:8000"
    # Bate no /healthz (verifica banco + cache). start_period cobre o boot
    # (migrate + collectstatic) para não marcar unhealthy cedo demais.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 60s

  # OnlyOffice Document Server: edição de Word/Excel/PowerPoint/PDF no navegador
  # (aba Observações do roteiro e Drive). Fica na MESMA rede do backend, então o DS
  # alcança o Django por nome de serviço: no .env, ONLYOFFICE_BACKEND_URL=http://backend:8000
  # (sem round-trip público). O NAVEGADOR acessa o DS pela ONLYOFFICE_DS_URL (domínio
  # público roteado pelo Nginx Proxy Manager -> ONLYOFFICE_PORT, com WebSocket LIGADO).
  # O JWT_SECRET aqui TEM que ser IGUAL ao ONLYOFFICE_JWT_SECRET do backend — os dois
  # leem a MESMA variável do .env. Sem segredo, o callback de salvar é rejeitado.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
    # Porta publicada no host (NPM aponta o domínio do DS pra cá). O DS escuta 80
    # dentro do container. Use uma porta livre e DIFERENTE entre develop e prod.
    ports:
      - "${ONLYOFFICE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  media_data:
  geoip_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
